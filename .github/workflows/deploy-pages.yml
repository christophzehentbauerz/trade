name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify application
        run: node --test tests/*.test.cjs

      - name: Assemble public site
        run: |
          mkdir -p _site/api _site/lib _site/web
          cp index.html *.css _site/
          for file in *.js; do
            case "$file" in
              *config*|backtest-*.js|spot-sell-test.js) ;;
              *) cp "$file" _site/ ;;
            esac
          done
          cp -R api/* _site/api/
          cp lib/*.mjs _site/lib/
          cp web/*.html _site/web/
          echo '// Optional credentials are entered locally through the dashboard.' > _site/telegram-config.js
          echo '// No public API key. Configure a server proxy to use CoinMarketCap.' > _site/cmc-config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
